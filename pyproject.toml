[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maro-processor"
version = "0.1.0"
description = "Hybrid Native & OCR PDF Layout Extraction Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andriamarolahy R.", email = "marolahyrabe@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
pdf-native = [
    "pdfplumber>=0.11.0",
]
pdf-ocr = [
    "pdfplumber>=0.11.0",
    "paddlepaddle>=3.3.1",
    "paddleocr>=2.7.0",
    "scikit-learn>=1.4.0",
    "opencv-python-headless>=4.9.0",
    "rapidfuzz>=3.6.0",
]
all = [
    "pdfplumber>=0.11.0",
    "paddleocr>=2.7.0",
    "scikit-learn>=1.4.0",
    "opencv-python-headless>=4.9.0",
    "rapidfuzz>=3.6.0",
]

[project.urls]
Homepage = "https://github.io"
Repository = "https://github.com"

[tool.hatch.version]
path = "src/maro_processor/__init__.py"

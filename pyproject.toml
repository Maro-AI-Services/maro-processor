[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maro-processor"
dynamic = ["version"]
description = "Hybrid Multi-Modal Content Intelligence Platform for Native & OCR Data Extraction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andriamarolahy R.", email = "marolahyrabe@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
pdf-native = [
    "pdfplumber>=0.11.0",
]
pdf-ocr = [
    "pdfplumber>=0.11.0",
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
    "scikit-learn>=1.4.0",
    "opencv-python-headless>=4.9.0",
    "rapidfuzz>=3.6.0",
]
all = [
    "pdfplumber>=0.11.0",
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
    "scikit-learn>=1.4.0",
    "opencv-python-headless>=4.9.0",
    "rapidfuzz>=3.6.0",
]

[project.urls]
Homepage = "https://marolai.github.io"
Repository = "https://github.com/Maro-AI-Services/maro-processor"

[tool.hatch.version]
path = "src/maro_processor/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# GitHub Actions Continuous Integration (CI) Workflow for maro-processor
# Automatically builds, installs, and runs unit tests on push or pull requests
name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Enforces testing against your modern targeted runtime baselines (>=3.10)
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Automatically speeds up subsequent workflow build runs

    - name: Install Dependencies & Modular Package
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Installs local package in editable mode with native PDF deps.
        # OCR tests self-skip when PaddleOCR extras are not installed.
        pip install -e .[pdf-native]
        pip install pytest

    - name: Run Test Suite via pytest
      env:
        # Forces the virtual environment to map your src/ layout directly into Python paths
        PYTHONPATH: src
      run: |
        pytest
